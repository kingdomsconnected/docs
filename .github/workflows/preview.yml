name: Validate documentation preview

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout documentation
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build preview
        env:
          KCDC_SERVICES_API_URL: ${{ vars.KCDC_SERVICES_API_URL }}
          KCDC_CONTRACT_CHANNEL: testing
        run: npm run build
